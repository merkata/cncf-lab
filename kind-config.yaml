kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Cilium Gateway API hostNetwork listener (Gateway port 8080)
      - containerPort: 8080
        hostPort: 80
        protocol: TCP
      # Argo CD (existing; can be removed once Argo has an HTTPRoute)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Reserved for an HTTPS Gateway listener on port 8443
      - containerPort: 8443
        hostPort: 8443
        protocol: TCP
