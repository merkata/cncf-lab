kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Harbor is served over plain HTTP inside the cluster. containerd performs
# image pulls from the node network namespace, so it needs both an HTTP
# registry endpoint and a resolvable Harbor service name.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."harbor.harbor.svc.cluster.local"]
      endpoint = ["http://harbor.harbor.svc.cluster.local"]
    [plugins."io.containerd.grpc.v1.cri".registry.configs."harbor.harbor.svc.cluster.local".tls]
      insecure_skip_verify = true
nodes:
  - role: control-plane
    extraPortMappings:
      # The Istio ingress gateway is a NodePort Service. kind publishes ports
      # from the node container, so map the host's 80/443 to the nodePorts
      # pinned in istio-gateway-values.yaml.
      - containerPort: 30081
        hostPort: 80
        protocol: TCP
      - containerPort: 30444
        hostPort: 443
        protocol: TCP
      # Argo CD (NodePort 30080). It is also reachable through the Istio
      # gateway at http://argocd.127.0.0.1.nip.io once the app-of-apps syncs.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
