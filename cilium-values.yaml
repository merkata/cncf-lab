kubeProxyReplacement: "true"
k8sServicePort: "6443"

ipam:
  mode: kubernetes

operator:
  replicas: 1

envoy:
  enabled: true

hubble:
  relay:
    enabled: true
  ui:
    enabled: true

gatewayAPI:
  enabled: true
  gatewayClass:
    create: "true"
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        ingress-ready: "true"
